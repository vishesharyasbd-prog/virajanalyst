  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #211a0c 0%, #080808 48%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border: 1px solid #c9a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e7c66e;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 0 30px #c9a34a20;
    }

    .eyebrow {
      color: #d7b45b;
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 13px;
    }

    h1 {
      font-size: clamp(30px, 8vw, 39px);
      letter-spacing: 2px;
      font-weight: 800;
      line-height: 1.2;
    }

    h1 span {
      color: #d7b45b;
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      line-height: 1.8;
      margin: 14px 0 25px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(145deg, #191919, #0e0e0e);
      border: 1px solid #3a2d17;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .play {
      width: 49px;
      height: 49px;
      border: 1px solid #c9a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e7c66e;
      font-size: 19px;
      padding-left: 3px;
    }

    .video-label {
      font-size: 10px;
      color: #999;
      letter-spacing: 2px;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 17px 14px;
      border-radius: 8px;
      background: linear-gradient(100deg, #b58b32, #f0d583, #b58b32);
      color: #080808;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
      transition: transform .2s, filter .2s;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .note {
      margin-top: 17px;
      font-size: 10px;
      color: #777;
      line-height: 1.7;
    }

    .footer {
      margin-top: 30px;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>

  <main class="container">

    </p>

    <div class="footer">VIRAJ ANALYST © 2026</div>
